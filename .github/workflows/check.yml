name: Check static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test release discovery fixtures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate workflow configuration
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Verify generated output
        run: python scripts/build.py --check
      - name: Check source data and site
        run: python scripts/check.py --self-test && python scripts/check.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser, no-JavaScript, size, overflow and WCAG checks
        run: npm run test:browser
        env:
          EVIDENCE_DIR: test-results/browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/browser
          if-no-files-found: warn
