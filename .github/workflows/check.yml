name: Check static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard append-only corrections history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/corrections.py --base "$BASE_SHA"
          else
            python3 scripts/corrections.py
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test release discovery fixtures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate append-only release timing ledger and JSON report
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          : > /tmp/release-timing-previous.jsonl
          if [ -n "$BASE_REVISION" ] && [[ ! "$BASE_REVISION" =~ ^0+$ ]]; then
            git cat-file -e "$BASE_REVISION^{commit}"
            if git cat-file -e "$BASE_REVISION:measurements/release-timing.jsonl" 2>/dev/null; then
              git show "$BASE_REVISION:measurements/release-timing.jsonl" > /tmp/release-timing-previous.jsonl
            fi
          fi
          python scripts/release_timing.py report --ledger measurements/release-timing.jsonl --previous-ledger /tmp/release-timing-previous.jsonl
      - name: Validate workflow configuration
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Verify generated output
        run: python scripts/build.py --check
      - name: Check source data and site
        run: python scripts/check.py --self-test && python scripts/check_history.py --self-test && python -m unittest discover -s tests -p 'test_*.py' && python scripts/check.py
      - name: Validate manual accessibility material coverage (not people checks)
        run: python scripts/manual_access.py
      - name: Discover every generated HTML page
        id: pages
        run: python -c 'import json, pathlib, os; pages = sorted(str(p.relative_to("site")) for p in pathlib.Path("site").rglob("*.html")); assert pages; print("pages=" + json.dumps(pages), file=open(os.environ["GITHUB_OUTPUT"], "a"))'
  browser:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.check.outputs.pages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test browser runner failure handling and SVG contrast
        run: node --test tests/*.test.mjs
      - name: Browser, no-JavaScript, size, overflow and WCAG checks
        run: npm run test:browser
        env:
          EVIDENCE_DIR: test-results/browser
          CHECK_PAGE: ${{ matrix.page }}
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ strategy.job-index }}
          path: test-results/browser
          if-no-files-found: warn
